# Use `tmux source ~/.tmux.conf` to hot-reload the configuration after making changes.

# Weird behavior where ESC takes 500ms to register
set -s escape-time 0

# Set fish shell as launch shell (even if fish is not the login shell)
set -g default-shell /opt/homebrew/bin/fish

# Enable mouse mode and vi mode
set -g mode-keys vi
set -g mouse on

# Coding agents (kitty)
set -g extended-keys off
bind-key -n S-Enter send-keys Escape "[13;2u" # Bind Shift+Enter to send a literal Line Feed (Escape sequence for newline)
# set -g extended-keys on
# set -g extended-keys-format csi-u

# Jujutsu macro (hint: use '<C-b> &' to kill the window)
bind-key J \
  send-keys 'watch -c jj log -r "::" --color=always' C-m \; \
  split-window -h -c "#{pane_current_path}" 'fm' \; \
  split-window -v -c "#{pane_current_path}" 'watch -c jj st --color=always' \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-layout tiled

# Copy mode: https://dev.to/iggredible/the-easy-way-to-copy-text-in-tmux-319g
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-no-clear
bind-key P paste-buffer
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
# (macos version: "pbcopy")
# bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# bind P paste-buffer
# bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Vim-like pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Open new panes in the current directory
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe-no-clear'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
